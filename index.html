<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobileconfig Builder — WebClip iOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --pink: #f472b6;
    --green: #4ade80;
    --red: #f87171;
    --ink: #e2e8f0;
    --muted: #94a3b8;
    --glass: rgba(15, 23, 42, 0.55);
    --glass-border: rgba(148, 163, 184, 0.18);
  }

  html, body {
    min-height: 100%;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    background: #060912;
  }

  /* ---------- Static background ---------- */
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(1200px 700px at 20% 15%, rgba(34, 211, 238, 0.18), transparent 60%),
      radial-gradient(900px 650px at 85% 80%, rgba(167, 139, 250, 0.2), transparent 60%),
      radial-gradient(700px 500px at 50% 100%, rgba(244, 114, 182, 0.12), transparent 60%),
      linear-gradient(180deg, #060912 0%, #0b1220 55%, #0f172a 100%);
  }
  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
  }

  /* ---------- Layout ---------- */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 30px;
    animation: fadeDown 0.7s cubic-bezier(.2,.8,.2,1) both;
  }
  .logo-ring {
    position: relative;
    width: 132px; height: 132px;
    border-radius: 32px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    background: linear-gradient(145deg, rgba(34,211,238,0.22), rgba(167,139,250,0.22));
    padding: 3px;
  }
  .logo-ring::before {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 40px;
    background: conic-gradient(from 0deg, var(--cyan), var(--violet), var(--pink), var(--cyan));
    filter: blur(16px);
    opacity: 0.55;
    z-index: -1;
    animation: spin 9s linear infinite;
  }
  .logo-ring img {
    width: 100%; height: 100%;
    border-radius: 29px;
    object-fit: cover;
    background: #0b1220;
    box-shadow: 0 12px 40px -8px rgba(34,211,238,0.55), inset 0 0 0 1px rgba(255,255,255,0.08);
  }

  .brand h1 {
    font-size: clamp(1.55rem, 4vw, 2.15rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.1;
    background: linear-gradient(100deg, #fff 0%, var(--cyan) 45%, var(--violet) 75%, var(--pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shimmer 6s linear infinite;
  }
  .brand p {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    max-width: 400px;
    line-height: 1.5;
  }
  .brand .badge {
    margin-top: 14px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(34, 211, 238, 0.1);
    border: 1px solid rgba(34, 211, 238, 0.3);
    color: var(--cyan);
    letter-spacing: 0.05em;
  }
  .badge .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }

  /* ---------- Card ---------- */
  .card {
    width: 100%;
    max-width: 620px;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 30px;
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, 0.85),
      0 0 0 1px rgba(255, 255, 255, 0.03) inset,
      0 1px 0 rgba(255, 255, 255, 0.06) inset;
    animation: fadeUp 0.8s 0.1s cubic-bezier(.2,.8,.2,1) both;
  }

  .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px dashed rgba(148, 163, 184, 0.18);
  }
  .card-title::before {
    content: '';
    width: 4px; height: 14px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--cyan), var(--violet));
  }

  label {
    display: block;
    font-size: 0.74rem;
    font-weight: 600;
    color: var(--muted);
    margin: 16px 0 7px;
    letter-spacing: 0.04em;
  }

  input[type=text], input[type=url] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 11px;
    border: 1px solid rgba(148, 163, 184, 0.2);
    background: rgba(2, 6, 23, 0.6);
    color: var(--ink);
    font-size: 0.9rem;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input[type=text]:focus, input[type=url]:focus {
    border-color: var(--cyan);
    background: rgba(2, 6, 23, 0.85);
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
  }
  input::placeholder { color: #475569; }

  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; min-width: 0; }

  /* ---------- Dropzone ---------- */
  .dropzone {
    position: relative;
    border: 2px dashed rgba(148, 163, 184, 0.28);
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s, transform .15s;
    background: rgba(2, 6, 23, 0.35);
    overflow: hidden;
  }
  .dropzone:hover {
    border-color: var(--cyan);
    background: rgba(34, 211, 238, 0.06);
  }
  .dropzone.dragover {
    border-color: var(--violet);
    background: rgba(167, 139, 250, 0.1);
    transform: scale(1.01);
  }
  .dropzone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%; height: 100%;
  }
  .dz-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .dz-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, rgba(34,211,238,0.15), rgba(167,139,250,0.15));
    border: 1px solid rgba(148, 163, 184, 0.2);
    font-size: 22px;
  }
  .dz-text {
    font-size: 0.86rem;
    color: var(--ink);
    font-weight: 500;
  }
  .dz-hint {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .preview-panel {
    display: none;
    margin-top: 14px;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 14px;
    background: rgba(2, 6, 23, 0.5);
    border: 1px solid rgba(148, 163, 184, 0.15);
    animation: fadeUp 0.4s ease both;
  }
  .preview-panel.show { display: flex; }
  .preview-panel img {
    width: 60px; height: 60px;
    border-radius: 14px;
    object-fit: cover;
    border: 1px solid rgba(148, 163, 184, 0.25);
    box-shadow: 0 6px 20px -6px rgba(34,211,238,0.5);
  }
  .preview-meta { flex: 1; min-width: 0; }
  .preview-meta .name {
    font-size: 0.82rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preview-meta .info {
    font-size: 0.72rem;
    color: var(--cyan);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 3px;
  }

  /* ---------- Button ---------- */
  .btn {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: #fff;
    background: linear-gradient(120deg, #0891b2 0%, #6366f1 50%, #a855f7 100%);
    background-size: 200% auto;
    box-shadow:
      0 14px 32px -10px rgba(99, 102, 241, 0.7),
      0 0 0 1px rgba(255,255,255,0.08) inset;
    transition: transform .15s, box-shadow .25s, background-position .5s;
    position: relative;
    overflow: hidden;
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    background-position: right center;
    box-shadow:
      0 18px 40px -10px rgba(168, 85, 247, 0.8),
      0 0 0 1px rgba(255,255,255,0.12) inset;
  }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
    transition: left .6s;
  }
  .btn:hover:not(:disabled)::after { left: 120%; }

  /* ---------- Status ---------- */
  .status {
    margin-top: 16px;
    min-height: 22px;
    font-size: 0.8rem;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    color: var(--cyan);
    transition: color .2s;
    word-break: break-word;
  }
  .status.err { color: var(--red); }
  .status.ok  { color: var(--green); }

  /* ---------- Footer ---------- */
  .footer {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--muted);
    opacity: 0.75;
  }
  .footer a { color: var(--cyan); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ---------- Animations ---------- */
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes pulse    { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.8); } }
  @keyframes shimmer  { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }

  /* ---------- Mobile ---------- */
  @media (max-width: 520px) {
    .page { padding: 26px 14px 40px; }
    .card { padding: 22px; border-radius: 20px; }
    .logo-ring { width: 108px; height: 108px; border-radius: 26px; }
    .logo-ring img { border-radius: 23px; }
    .row { flex-direction: column; gap: 0; }
    .brand h1 { font-size: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ===== BACKGROUND ===== -->
<div class="bg-overlay"></div>
<div class="bg-grid"></div>

<!-- ===== PAGE ===== -->
<div class="page">

  <!-- Brand / Logo -->
  <header class="brand">
    <div class="logo-ring">
      <img src="https://cdn.phototourl.com/member/2026-10-24-fee5b4e7-c8bd-4156-9ea3-6203e0913351.jpg" alt="Logo">
    </div>
    <h1>Mobileconfig Builder</h1>
    <p>Tạo profile iOS WebClip với icon tuỳ chỉnh — ảnh tự động convert sang PNG 512×512.</p>
    <span class="badge"><span class="dot"></span> tele: @dolong07</span>
  </header>

  <!-- Main card -->
  <main class="card">
    <div class="card-title">Profile Builder</div>

    <label for="label">Tên app / Label</label>
    <input type="text" id="label" placeholder="VD: TOOL MAKE AIM VIP" autocomplete="off" spellcheck="false">

    <label for="url">URL (ẩn khỏi giao diện iOS)</label>
    <input type="url" id="url" placeholder="https://..." autocomplete="off" spellcheck="false">

    <div class="row">
      <div>
        <label for="filename">File output</label>
        <input type="text" id="filename" placeholder="profile.mobileconfig" autocomplete="off" spellcheck="false">
      </div>
      <div>
        <label for="desc">Mô tả</label>
        <input type="text" id="desc" placeholder="tôi là gay" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <label>Icon (JPEG / PNG / WebP)</label>
    <div class="dropzone" id="dropzone">
      <input type="file" id="iconInput" accept="image/*">
      <div class="dz-content">
        <div class="dz-icon">🖼️</div>
        <div class="dz-text">Kéo &amp; thả ảnh hoặc bấm để chọn</div>
        <div class="dz-hint">→ tự động convert PNG 512×512</div>
      </div>
    </div>

    <div class="preview-panel" id="previewPanel">
      <img id="previewImg" alt="icon preview">
      <div class="preview-meta">
        <div class="name" id="previewName">—</div>
        <div class="info" id="previewInfo">—</div>
      </div>
    </div>

    <button class="btn" id="buildBtn">⚡ Tạo &amp; Tải Mobileconfig</button>
    <div class="status" id="status"></div>
  </main>

  <footer class="footer">
    <span>built for</span>
    <a href="https://t.me/dolong07" target="_blank" rel="noopener">t.me/dolong07</a>
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* ---------- Refs ---------- */
  const labelEl     = document.getElementById('label');
  const urlEl       = document.getElementById('url');
  const filenameEl  = document.getElementById('filename');
  const descEl      = document.getElementById('desc');
  const dropzone    = document.getElementById('dropzone');
  const iconInput   = document.getElementById('iconInput');
  const previewPanel= document.getElementById('previewPanel');
  const previewImg  = document.getElementById('previewImg');
  const previewName = document.getElementById('previewName');
  const previewInfo = document.getElementById('previewInfo');
  const buildBtn    = document.getElementById('buildBtn');
  const statusEl    = document.getElementById('status');

  let pngBase64 = '';

  /* ---------- Helpers ---------- */
  function say(msg, cls) {
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Không đọc được ảnh')); };
      img.src = url;
    });
  }

  function imageToPngBase64(img, size) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    const ratio = Math.min(size / img.width, size / img.height);
    const w = Math.round(img.width  * ratio);
    const h = Math.round(img.height * ratio);
    const x = Math.round((size - w) / 2);
    const y = Math.round((size - h) / 2);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, x, y, w, h);
    return canvas.toDataURL('image/png').split(',')[1] || '';
  }

  function xmlEscape(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&apos;');
  }

  function uuidv4() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID().toUpperCase();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = (Math.random() * 16) | 0;
      const v = c === 'x' ? r : (r & 0x3) | 0x8;
      return v.toString(16).toUpperCase();
    });
  }

  /* ---------- Icon processing ---------- */
  async function handleIconFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      say('File không phải ảnh.', 'err');
      return;
    }
    say('Đang xử lý ảnh…');
    try {
      const img = await loadImageFromFile(file);
      pngBase64 = imageToPngBase64(img, 512);

      previewImg.src = 'data:image/png;base64,' + pngBase64;
      previewName.textContent = file.name;
      previewInfo.textContent =
        `PNG 512×512 · ${(pngBase64.length / 1024).toFixed(1)} KB (base64)`;
      previewPanel.classList.add('show');
      say('Ảnh sẵn sàng ✔', 'ok');
    } catch (e) {
      say('Lỗi ảnh: ' + e.message, 'err');
    }
  }

  iconInput.addEventListener('change', () => {
    handleIconFile(iconInput.files && iconInput.files[0]);
  });

  ['dragenter','dragover'].forEach(ev => {
    dropzone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave','drop'].forEach(ev => {
    dropzone.addEventListener(ev, e => {
      e.preventDefault(); e.stopPropagation();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', e => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleIconFile(f);
  });

  /* ---------- Build mobileconfig ---------- */
  function buildMobileconfig({ label, url, description, iconBase64 }) {
    const webclipUUID = uuidv4();
    const profileUUID = uuidv4();
    const iconBlock = iconBase64
      ? `            <key>Icon</key>\n            <data>${iconBase64}</data>\n`
      : '';

    return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>PayloadContent</key>
    <array>
        <dict>
            <key>PayloadType</key>
            <string>com.apple.webClip.managed</string>
            <key>PayloadIdentifier</key>
            <string>com.dolong07.webclip.${webclipUUID}</string>
            <key>PayloadUUID</key>
            <string>${webclipUUID}</string>
            <key>PayloadVersion</key>
            <integer>1</integer>
            <key>PayloadDisplayName</key>
            <string>${xmlEscape(label)}</string>
            <key>PayloadDescription</key>
            <string>${xmlEscape(description)}</string>
            <key>PayloadOrganization</key>
            <string>${xmlEscape(description)}</string>
            <key>Label</key>
            <string>${xmlEscape(label)}</string>
            <key>URL</key>
            <string>${xmlEscape(url)}</string>
            <key>IsRemovable</key>
            <true/>
            <key>FullScreen</key>
            <true/>
            <key>IgnoreManifestScope</key>
            <true/>
            <key>Precomposed</key>
            <true/>
${iconBlock}        </dict>
    </array>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadIdentifier</key>
    <string>com.dolong07.profile.${profileUUID}</string>
    <key>PayloadUUID</key>
    <string>${profileUUID}</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
    <key>PayloadDisplayName</key>
    <string>${xmlEscape(label)}</string>
    <key>PayloadDescription</key>
    <string>${xmlEscape(description)}</string>
    <key>PayloadOrganization</key>
    <string>${xmlEscape(description)}</string>
    <key>PayloadRemovalDisallowed</key>
    <false/>
</dict>
</plist>
`;
  }

  function downloadText(text, filename) {
    const blob = new Blob([text], { type: 'application/x-apple-aspen-config' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'profile.mobileconfig';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  /* ---------- Build action ---------- */
  buildBtn.addEventListener('click', () => {
    const label       = labelEl.value.trim();
    const url         = urlEl.value.trim();
    const description = descEl.value.trim();
    let   filename    = filenameEl.value.trim() || 'profile.mobileconfig';

    if (!label) return say('Chưa có label.', 'err');
    if (!url || !/^https?:\/\//i.test(url)) return say('URL không hợp lệ (cần http/https).', 'err');
    if (!pngBase64) return say('Chưa chọn icon.', 'err');
    if (!filename.toLowerCase().endsWith('.mobileconfig')) filename += '.mobileconfig';

    buildBtn.disabled = true;
    say('Đang tạo profile…');

    try {
      const xml = buildMobileconfig({ label, url, description, iconBase64: pngBase64 });
      downloadText(xml, filename);
      say(`Đã tải ${filename} · ${(xml.length / 1024).toFixed(1)} KB`, 'ok');
    } catch (e) {
      say('Lỗi build: ' + e.message, 'err');
    } finally {
      buildBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
